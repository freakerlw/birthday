<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0B0A09">
  <title>Happy Birthday</title>
  <!-- 渐进增强开关：只有 JS 可用时才挂 .js（以及非折减时的开场类），无 JS 时 hero 直接完整可见 -->
  <script>document.documentElement.classList.add("js");if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("is-opening");</script>
  <!-- 内联 favicon：不产生任何外部请求，也不会在本地服务下 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0A09'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23C8A96A'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="site">
    <section id="hero" class="section section--hero" aria-labelledby="hero-name">
      <div class="hero-glow hero-glow--a" aria-hidden="true"></div>
      <div class="hero-glow hero-glow--b" aria-hidden="true"></div>
    </section>

    <section id="gallery" class="section section--gallery"></section>
    <section id="timeline" class="section section--timeline"></section>
    <section id="letter" class="section section--letter"></section>
    <section id="wishes" class="section section--wishes"></section>
    <section id="surprise" class="section section--surprise"></section>
  </main>

  <footer id="footer" class="section section--footer"></footer>

  <!-- 内容先于逻辑加载：都是普通脚本，file:// 下可直接运行 -->
  <script src="content.js"></script>
  <script src="main.js"></script>
  <script src="anim.js"></script>
</body>
</html>
